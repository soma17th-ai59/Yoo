services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: hwp-agent-backend:0.1.0
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
    # No volumes for user data — sessions are in-memory only.

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: hwp-agent-frontend:0.1.0
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
